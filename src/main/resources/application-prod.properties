server.port=443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_PASSWORD}

# Database
spring.datasource.url=jdbc:mysql://prod-db.example.com:3306/myapp_stage
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Common JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none

# Flyway DB migration
# Use the same schema as the database
spring.flyway.default-schema=myapp_stage
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data