# Database
spring.datasource.url=jdbc:mysql://stage-db.example.com:3306/myapp_stage
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:you-forgot-to-set-db-password}

# Flyway DB migration
# Use the same schema as the database
spring.flyway.default-schema=myapp_stage
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data