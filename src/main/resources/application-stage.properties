# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/kairos
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:you-forgot-to-set-db-password}

# Swagger
springdoc.api-docs.enabled=false

# Flyway DB migration
# Use the same schema as the database
spring.flyway.default-schema=kairos
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data