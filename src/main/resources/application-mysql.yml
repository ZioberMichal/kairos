spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kairos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

  sql:
    init:
      mode: always
      data-locations: classpath:db/init/mysql-init.sql
