# application.properties
spring.application.name=Kairos
server.port=8080

spring.profiles.active=dev

# Database
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Common JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway DB migration
spring.flyway.baseline-on-migrate=true
# out-of-order=false ensures migrations run in order (safer for prod)
spring.flyway.out-of-order=false
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data,classpath:db/migration/mockdata

# JSON serialization
spring.jackson.serialization.fail-on-empty-beans=false
